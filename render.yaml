services:
  - type: web
    name: bu-kanji-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AI_REQUESTS_PER_MINUTE
        value: "12"
      - key: AI_REQUESTS_PER_DAY
        value: "100"
      - key: AI_GLOBAL_REQUESTS_PER_DAY
        value: "1000"
      - key: DATABASE_URL
        fromDatabase:
          name: bu-kanji-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      # Render private Postgres TLS uses self-signed certificates; encryption stays enabled.
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: FRONTEND_URL
        value: https://bu-kanji.vercel.app
      - key: CORS_ORIGIN
        value: https://bu-kanji.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AUTH_RATE_LIMIT_SECRET
        generateValue: true
      - key: AUTH_LOGIN_EMAIL_LIMIT
        value: "5"
      - key: AUTH_LOGIN_IP_LIMIT
        value: "30"
      - key: AUTH_LOGIN_WINDOW_SECONDS
        value: "900"
    # Email signup does not require Resend. Configure Resend only for password recovery.
    # AUTH_TRUSTED_PROXY_CIDRS must match verified proxy topology; never trust all proxies.
    # Google OAuth is optional; see DEPLOYMENT-START-HERE.md.

databases:
  - name: bu-kanji-db
    plan: free
    region: singapore
    databaseName: bu_kanji
    user: bu_kanji
    postgresMajorVersion: "16"
    ipAllowList: []
