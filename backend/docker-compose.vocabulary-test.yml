name: bu-kanji-vocabulary-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vocabulary_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: bu_kanji_vocabulary_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vocabulary_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabulary_test -d bu_kanji_vocabulary_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  vocabulary_test_data:
